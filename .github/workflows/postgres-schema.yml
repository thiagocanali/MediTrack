name: PostgreSQL schema and RLS
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/postgres-schema.yml'
  push:
    branches: [flutcode]
    paths:
      - 'backend/**'
      - '.github/workflows/postgres-schema.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meditrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: meditrack_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply schema
        run: psql -v ON_ERROR_STOP=1 -f backend/migrations/0001_initial.sql
      - name: Apply name limit migration
        run: psql -v ON_ERROR_STOP=1 -f backend/migrations/0002_medication_name_limit.sql
      - name: Verify integrity constraints
        run: psql -v ON_ERROR_STOP=1 -f backend/tests/integrity_smoke.sql
      - name: Verify cross-user dose writes
        run: psql -v ON_ERROR_STOP=1 -f backend/tests/dose_write_rls.sql
      - name: Verify user isolation
        run: psql -v ON_ERROR_STOP=1 -f backend/tests/rls_smoke.sql
